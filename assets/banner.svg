<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients matching GitHub Dark Theme (#0d1117 / #161b22) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Accent Color Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="code-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="infra-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="28" cy="28" r="1" fill="#484f58" opacity="0.4" />
    </pattern>

    <!-- Subtle Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas Box -->
  <rect width="850" height="260" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Infrastructure Architectural Grid -->
  <rect width="850" height="260" rx="10" fill="url(#infra-grid)" />

  <!-- Top Accent Cyan Line -->
  <rect x="0" y="0" width="850" height="2" fill="url(#cyan-glow)" />

  <!-- Terminal Titlebar Header -->
  <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 840 0 C 845.53 0 850 4.47 850 10 L 850 36 L 0 36 Z" fill="#161b22" />
  <line x1="0" y1="36" x2="850" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Window Control Dots -->
  <circle cx="18" cy="18" r="4.5" fill="#ff5f56" />
  <circle cx="32" cy="18" r="4.5" fill="#ffbd2e" />
  <circle cx="46" cy="18" r="4.5" fill="#27c93f" />

  <!-- Terminal Window Subtitle -->
  <text x="64" y="22" font-family="'ui-monospace', 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#8b949e" font-weight="500">
    aswinraj1116 // infra-node-01.prod.internal
  </text>

  <!-- Live Infrastructure Status Tag (Top Right) -->
  <g transform="translate(685, 10)">
    <rect width="145" height="17" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="8.5" r="3" fill="#2ea043" filter="url(#glow-green)" />
    <text x="22" y="12" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="9.5" fill="#3fb950" font-weight="600">SYS: ACTIVE | 99.99%</text>
  </g>

  <!-- LEFT COLUMN: ENGINEERING IDENTIFIER -->
  <g transform="translate(36, 52)">

    <!-- Subtitle Header Badge -->
    <g transform="translate(0, 8)">
      <rect width="250" height="22" rx="4" fill="#161b22" stroke="#1f6feb" stroke-width="1" />
      <text x="10" y="15" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="10" fill="#58a6ff" font-weight="600" letter-spacing="0.5">
        &gt; DISTRIBUTED SYSTEMS &amp; CLOUD
      </text>
    </g>

    <!-- Candidate Name -->
    <text x="0" y="68" font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">
      K ASWIN RAJ
    </text>

    <!-- Professional Role -->
    <text x="0" y="93" font-family="system-ui, -apple-system, 'SF Pro Text', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Backend &amp; Cloud Engineer
    </text>

    <!-- Position & Organization -->
    <text x="0" y="114" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="11" fill="#8b949e">
      // Systems Engineer @ Publicis Sapient
    </text>

    <!-- Tier 1 Core Tech Focus Pills -->
    <g transform="translate(0, 134)">
      <!-- Go -->
      <g transform="translate(0,0)">
        <rect width="50" height="24" rx="5" fill="#161b22" stroke="#00add8" stroke-width="1.2" />
        <text x="25" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#00add8" text-anchor="middle">Go</text>
      </g>
      <!-- AWS -->
      <g transform="translate(56,0)">
        <rect width="56" height="24" rx="5" fill="#161b22" stroke="#ff9900" stroke-width="1.2" />
        <text x="28" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ff9900" text-anchor="middle">AWS</text>
      </g>
      <!-- Kubernetes -->
      <g transform="translate(118,0)">
        <rect width="98" height="24" rx="5" fill="#161b22" stroke="#326ce5" stroke-width="1.2" />
        <text x="49" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">Kubernetes</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(222,0)">
        <rect width="96" height="24" rx="5" fill="#161b22" stroke="#4169e1" stroke-width="1.2" />
        <text x="48" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">PostgreSQL</text>
      </g>
      <!-- Docker -->
      <g transform="translate(324,0)">
        <rect width="70" height="24" rx="5" fill="#161b22" stroke="#2496ed" stroke-width="1.2" />
        <text x="35" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Docker</text>
      </g>
    </g>

  </g>

  <!-- RIGHT COLUMN: CODE SPEC & TOPOLOGY GRAPH -->
  <g transform="translate(470, 52)">

    <!-- Code Container Box -->
    <rect width="344" height="182" rx="8" fill="url(#code-bg)" stroke="#30363d" stroke-width="1" />

    <!-- Code Header Bar -->
    <path d="M 470 60 C 470 54 474 52 478 52 L 806 52 C 810 52 814 54 814 60 L 814 74 L 470 74 Z" fill="#161b22" />
    <text x="12" y="15" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="10" fill="#8b949e" font-weight="600">
      system_architecture.go
    </text>

    <!-- Go Struct Spec Snippet -->
    <g transform="translate(14, 32)" font-family="'ui-monospace', 'SFMono-Regular', Consolas, monospace" font-size="10.5">
      <text x="0" y="0" fill="#ff7b72">type <tspan fill="#f0f6fc">ProductionSystem</tspan> struct <tspan fill="#8b949e">{</tspan></text>
      <text x="12" y="16" fill="#79c0ff">CoreEngine   <tspan fill="#f0f6fc">GoMicroservices</tspan></text>
      <text x="12" y="30" fill="#d2a8ff">DataStore    <tspan fill="#f0f6fc">PostgreSQL_RDS</tspan></text>
      <text x="12" y="44" fill="#7ee787">CloudInfra   <tspan fill="#f0f6fc">AWS_EKS</tspan></text>
      <text x="12" y="58" fill="#ffa657">Container    <tspan fill="#f0f6fc">HardenedDocker</tspan></text>
      <text x="12" y="72" fill="#79c0ff">Pipeline     <tspan fill="#f0f6fc">GitLab_CI_GitOps</tspan></text>
      <text x="12" y="86" fill="#ff7b72">Telemetry    <tspan fill="#f0f6fc">Grafana_CloudWatch</tspan></text>
      <text x="0" y="102" fill="#8b949e">}</text>
    </g>

    <!-- Microservice Infrastructure Topology Diagram (Overlay Right) -->
    <g transform="translate(222, 22)">
      <!-- Connecting Grid Lines -->
      <line x1="30" y1="28" x2="72" y2="58" stroke="#1f6feb" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8" />
      <line x1="72" y1="58" x2="35" y2="98" stroke="#2ea043" stroke-width="1.2" opacity="0.8" />
      <line x1="72" y1="58" x2="98" y2="88" stroke="#8957e5" stroke-width="1.2" opacity="0.8" />

      <!-- Central API Gateway Node -->
      <circle cx="72" cy="58" r="14" fill="#0d1117" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
      <text x="72" y="61" font-family="'ui-monospace', monospace" font-size="8" fill="#38bdf8" font-weight="800" text-anchor="middle">API</text>

      <!-- AWS Cloud Node -->
      <circle cx="30" cy="28" r="11" fill="#0d1117" stroke="#ff9900" stroke-width="1.5" />
      <text x="30" y="31" font-family="'ui-monospace', monospace" font-size="7" fill="#ff9900" font-weight="700" text-anchor="middle">AWS</text>

      <!-- K8s Pod Node -->
      <circle cx="35" cy="98" r="11" fill="#0d1117" stroke="#34d399" stroke-width="1.5" />
      <text x="35" y="101" font-family="'ui-monospace', monospace" font-size="7" fill="#34d399" font-weight="700" text-anchor="middle">K8s</text>

      <!-- DB Node -->
      <circle cx="98" cy="88" r="11" fill="#0d1117" stroke="#818cf8" stroke-width="1.5" />
      <text x="98" y="91" font-family="'ui-monospace', monospace" font-size="7" fill="#818cf8" font-weight="700" text-anchor="middle">DB</text>
    </g>

  </g>
</svg>
