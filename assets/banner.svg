<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <!-- Subtle Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="260" rx="12" fill="url(#bg-gradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Architectural Grid Layer -->
  <rect width="850" height="260" rx="12" fill="url(#grid)" />

  <!-- Decorative Top Glow Line -->
  <rect x="0" y="0" width="850" height="2" fill="url(#accent-cyan)" />

  <!-- Terminal Window Top Header -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 838 0 C 844.63 0 850 5.37 850 12 L 850 36 L 0 36 Z" fill="#111827" fill-opacity="0.9" />
  <line x1="0" y1="36" x2="850" y2="36" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Buttons -->
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />

  <!-- Terminal Title Tag -->
  <text x="72" y="22" font-family="'ui-monospace', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b" font-weight="500">
    aswinraj1116.go — backend-cloud-architecture
  </text>

  <!-- Live System Status Badge (Right Corner of Header) -->
  <g transform="translate(735, 11)">
    <rect width="95" height="15" rx="7.5" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8" />
    <circle cx="10" cy="7.5" r="3" fill="#34d399" filter="url(#glow-green)" />
    <text x="18" y="11" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="9" fill="#34d399" font-weight="600">SYS_ONLINE</text>
  </g>

  <!-- LEFT SECTION: IDENTITY & ROLES -->
  <g transform="translate(36, 54)">

    <!-- Subtitle Badge -->
    <g transform="translate(0, 10)">
      <rect width="215" height="22" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
      <text x="10" y="15" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="10" fill="#38bdf8" font-weight="600" letter-spacing="0.5">
        &gt; BACKEND &amp; CLOUD SYSTEMS
      </text>
    </g>

    <!-- Main Title / Name -->
    <text x="0" y="68" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      K ASWIN RAJ
    </text>

    <!-- Professional Role -->
    <text x="0" y="94" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Backend &amp; Cloud Engineer
    </text>

    <!-- System Philosophy / Tagline -->
    <text x="0" y="115" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="11" fill="#94a3b8">
      // Systems Engineer @ Publicis Sapient
    </text>

    <!-- Primary Tech Pills -->
    <g transform="translate(0, 134)">
      <!-- Go -->
      <g transform="translate(0,0)">
        <rect width="46" height="24" rx="6" fill="#1e293b" stroke="#00add8" stroke-width="1" />
        <text x="23" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#00add8" text-anchor="middle">Go</text>
      </g>
      <!-- AWS -->
      <g transform="translate(52,0)">
        <rect width="54" height="24" rx="6" fill="#1e293b" stroke="#ff9900" stroke-width="1" />
        <text x="27" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ff9900" text-anchor="middle">AWS</text>
      </g>
      <!-- Kubernetes -->
      <g transform="translate(112,0)">
        <rect width="94" height="24" rx="6" fill="#1e293b" stroke="#326ce5" stroke-width="1" />
        <text x="47" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">Kubernetes</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(212,0)">
        <rect width="94" height="24" rx="6" fill="#1e293b" stroke="#4169e1" stroke-width="1" />
        <text x="47" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">PostgreSQL</text>
      </g>
      <!-- Docker -->
      <g transform="translate(312,0)">
        <rect width="68" height="24" rx="6" fill="#1e293b" stroke="#2496ed" stroke-width="1" />
        <text x="34" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Docker</text>
      </g>
    </g>

  </g>

  <!-- RIGHT SECTION: ARCHITECTURE CARD & NETWORK NODES -->
  <g transform="translate(480, 52)">

    <!-- Terminal Code Block Frame -->
    <rect width="334" height="182" rx="8" fill="url(#card-bg)" stroke="#334155" stroke-width="1" />

    <!-- Code Header Bar -->
    <path d="M 480 60 C 480 54 484 52 488 52 L 806 52 C 810 52 814 54 814 60 L 814 74 L 480 74 Z" fill="#0f172a" fill-opacity="0.8" />
    <text x="12" y="15" font-family="'ui-monospace', 'SFMono-Regular', monospace" font-size="10" fill="#64748b" font-weight="600">
      architecture_spec.go
    </text>

    <!-- Code Snippet Content -->
    <g transform="translate(14, 32)" font-family="'ui-monospace', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5">
      <text x="0" y="0" fill="#f43f5e">type <tspan fill="#f8fafc">ProductionSystem</tspan> struct <tspan fill="#94a3b8">{</tspan></text>
      <text x="12" y="16" fill="#38bdf8">Backend    <tspan fill="#f8fafc">GoMicroservices</tspan></text>
      <text x="12" y="30" fill="#818cf8">Database   <tspan fill="#f8fafc">PostgreSQL</tspan></text>
      <text x="12" y="44" fill="#34d399">Cloud      <tspan fill="#f8fafc">AWS</tspan></text>
      <text x="12" y="58" fill="#fbbf24">Container  <tspan fill="#f8fafc">DockerHardened</tspan></text>
      <text x="12" y="72" fill="#60a5fa">Orchestrator <tspan fill="#f8fafc">Kubernetes</tspan></text>
      <text x="12" y="86" fill="#c084fc">Pipeline   <tspan fill="#f8fafc">GitLabCI_GitOps</tspan></text>
      <text x="12" y="100" fill="#f472b6">Telemetry  <tspan fill="#f8fafc">Grafana_CloudWatch</tspan></text>
      <text x="0" y="115" fill="#94a3b8">}</text>
    </g>

    <!-- Interactive Infrastructure Node Graph Graphic (Overlay Right) -->
    <g transform="translate(210, 25)">
      <!-- Connecting Grid Lines -->
      <line x1="30" y1="25" x2="70" y2="55" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8" />
      <line x1="70" y1="55" x2="35" y2="95" stroke="#059669" stroke-width="1.2" opacity="0.8" />
      <line x1="70" y1="55" x2="95" y2="85" stroke="#6366f1" stroke-width="1.2" opacity="0.8" />
      <line x1="30" y1="25" x2="95" y2="85" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" />

      <!-- Central Gateway Node -->
      <circle cx="70" cy="55" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
      <text x="70" y="58" font-family="'ui-monospace', monospace" font-size="8" fill="#38bdf8" font-weight="800" text-anchor="middle">API</text>

      <!-- Cloud Node -->
      <circle cx="30" cy="25" r="11" fill="#0f172a" stroke="#ff9900" stroke-width="1.5" />
      <text x="30" y="28" font-family="'ui-monospace', monospace" font-size="7" fill="#ff9900" font-weight="700" text-anchor="middle">AWS</text>

      <!-- K8s Node -->
      <circle cx="35" cy="95" r="11" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
      <text x="35" y="98" font-family="'ui-monospace', monospace" font-size="7" fill="#34d399" font-weight="700" text-anchor="middle">K8s</text>

      <!-- DB Node -->
      <circle cx="95" cy="85" r="11" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
      <text x="95" y="88" font-family="'ui-monospace', monospace" font-size="7" fill="#818cf8" font-weight="700" text-anchor="middle">DB</text>
    </g>

  </g>
</svg>
